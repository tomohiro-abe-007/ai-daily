<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>語学習得 日報 アーカイブ</title>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #f0ece3;
    font-family: 'Klee One', 'Hiragino Maru Gothic Pro', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 20px;
  }
  .header {
    background: linear-gradient(135deg, #2a7a4b 0%, #1a4d30 100%);
    color: white;
    border-radius: 8px;
    padding: 40px 40px;
    text-align: center;
    width: 100%;
    max-width: 700px;
    margin-bottom: 28px;
    box-shadow: 4px 6px 20px rgba(0,0,0,0.3);
  }
  .header h1 { font-size: 2rem; font-weight: 600; margin-bottom: 8px; }
  .header p  { font-size: 0.98rem; opacity: 0.85; }
  .list {
    width: 100%;
    max-width: 700px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .entry {
    background: #fff9f0;
    border-radius: 6px;
    box-shadow: 2px 3px 10px rgba(0,0,0,0.1);
    overflow: hidden;
  }
  .entry a {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 24px;
    text-decoration: none;
    color: inherit;
    transition: background 0.15s;
  }
  .entry a:hover { background: #f5f0e5; }
  .entry-date {
    font-size: 0.88rem;
    color: #888;
    white-space: nowrap;
  }
  .entry-title {
    font-size: 1.02rem;
    color: #2c3e50;
    line-height: 1.4;
  }
  .entry-arrow {
    margin-left: auto;
    color: #bbb;
    font-size: 1.1rem;
  }
  .footer {
    margin-top: 32px;
    font-size: 0.82rem;
    color: #999;
    text-align: center;
  }
</style>
</head>
<body>

<div class="header">
  <h1>📖 語学習得 日報</h1>
  <p>英語ゼロから始める — 毎朝の語学学習ガイド</p>
</div>

<div class="list">

  <!-- 新しい記事を先頭に追加していく -->

      <span class="entry-date">2026-05-30</span>

      <span class="entry-arrow">→</span>

  </div>

</div>

<div class="footer">
  語学習得 日報アーカイブ — 毎朝更新
</div>
