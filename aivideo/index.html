<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI動画制作 日報 ダッシュボード</title>
<style>
  :root{--bg:#ece8e1;--card:#faf6ec;--dark:#1a3a5c;--dark2:#1a5c3a;--accent:#1a4a6b;--text:#2a3540;--muted:#7c8a82;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;line-height:1.7;padding:24px;}
  .wrap{max-width:860px;margin:0 auto;}
  header{background:linear-gradient(135deg,var(--dark),var(--dark2));color:#fff;border-radius:20px;padding:48px 32px;text-align:center;box-shadow:0 8px 24px rgba(26,58,92,.22);}
  header h1{font-size:1.9rem;letter-spacing:.06em;margin-bottom:12px;}
  header p{color:#c8dde8;font-size:1rem;}
  .list{margin-top:28px;display:flex;flex-direction:column;gap:14px;}
  a.entry{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:14px;padding:18px 22px;text-decoration:none;color:inherit;box-shadow:0 3px 10px rgba(0,0,0,.06);border:1px solid #efe9db;transition:transform .15s,box-shadow .15s;}
  a.entry:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(26,58,92,.14);}
  .entry-date{font-size:0.85rem;color:var(--muted);white-space:nowrap;min-width:90px;}
  .entry-title{font-size:1.05rem;color:var(--accent);font-weight:600;}
  .entry-desc{font-size:0.88rem;color:var(--muted);margin-top:2px;}
  footer{text-align:center;color:var(--muted);font-size:.82rem;margin-top:30px;line-height:1.9;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎬 AI動画制作 日報</h1>
    <p>生成AI×動画制作スキルを毎朝やさしく解説</p>
  </header>
  <div class="list">
    <!-- 最新エントリを先頭に追記していく -->
    <a class="entry" href="2026-05-30.html">
      <div class="entry-date">📅 2026-05-30</div>
      <div>
        <div class="entry-title">映像と音を同時に生成できる時代 ── Veo 3.1 &amp; Runway Gen-4</div>
        <div class="entry-desc">ネイティブ音声生成の解説・ツール比較・プロンプトの実例付き</div>
      </div>
    </a>
  </div>
  <footer>
    毎朝更新 ・ 各記事には出典URLを掲載しています<br>
    AIツールの機能・料金・商用利用の可否は変わります。重要な判断は必ず公式ページでご確認ください。
  </footer>
</div>
</body>
</html>
